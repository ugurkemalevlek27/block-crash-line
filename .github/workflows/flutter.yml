name: Block Crash Line — verify and build Android App Bundle
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Restore upload keystore from secrets (skipped when secrets are absent)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No upload keystore secret; bundle will be unsigned"; exit 0; fi
          mkdir -p android/keys
          echo "$KEYSTORE_BASE64" | base64 -d > android/keys/block-crash-upload.jks
          cat > android/key.properties <<EOP
          storeFile=keys/block-crash-upload.jks
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          EOP
      - run: flutter build appbundle --release --no-pub
      - run: flutter build apk --release --no-pub
      - name: Report bundle manifest (package, versionCode, targetSdk) and 16 KB page alignment
        run: |
          set -e
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$AAB" "$APK"
          sha256sum "$AAB" "$APK" | tee build/checksums.txt
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission" | tee build/apk_badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | tee build/apk_signature.txt || echo "APK unsigned (no upload key secrets)"
          mkdir -p build/aab_x && cd build/aab_x && unzip -q ../../"$AAB"
          echo "== 16 KB page-size alignment (p_align must be 0x4000 or 0x10000) ==" | tee ../elf_alignment.txt
          for so in $(find base/lib -name '*.so'); do
            al=$(readelf -lW "$so" | awk '/LOAD/{print $NF; exit}')
            case "$al" in 0x4000|0x10000) st=ALIGNED;; *) st=UNALIGNED;; esac
            echo "$st $al $so" | tee -a ../elf_alignment.txt
          done
          ! grep -q UNALIGNED ../elf_alignment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: block-crash-line-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/checksums.txt
            build/apk_badging.txt
            build/apk_signature.txt
            build/elf_alignment.txt
      - name: Remove keystore from runner
        if: always()
        run: rm -f android/keys/block-crash-upload.jks android/key.properties
