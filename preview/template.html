}.result strong{font-size:58px}.progress{width:100%;height:6px;border-radius:9px;background:#243956;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#72c4ff}.bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}.bg:after{content:'';position:absolute;inset:0;background:#061021be}.setting{margin:22px 0}.setting label{display:flex;justify-content:space-between;gap:12px}input[type=range]{width:100%;margin:14px 0}input[type=checkbox]{accent-color:#86caff;width:22px;height:22px}select{background:#182945;color:white;padding:10px;border:1px solid #344b6c;border-radius:10px;width:100%;margin-top:12px}.pill{font-size:11px;color:#bdd0ed;border:1px solid #314466;border-radius:30px;padding:8px 12px}#particles{position:fixed;inset:0;pointer-events:none;z-index:20}.particle{position:absolute;width:7px;height:7px;background:var(--spark,#8ee4fc);border-radius:2px;animation:fly .4s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(100deg);opacity:0}}@media(max-height:640px){main{padding-top:12px}.board{margin:8px auto}.slot{height:70px}.hud strong{font-size:25px}.scorefx{font-size:11px}.hero{padding:10px 0}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body><div class="bg" id="bg"></div><main id="app"></main><div id="particles"></div><script>
const LEVELS=__LEVELS__,ASSETS=__ASSETS__;
__ENGINE__
const KEY='block-crash-rehearsal-v1';const copy=x=>JSON.parse(JSON.stringify(x));
function initial(){return{coins:0,classicBest:0,timeBest:0,rushBest:null,bombUses:0,owned:['dark','plain'],achievements:[],rewards:[],levelStars:{},levelScores:{},theme:'dark',background:'plain',photo:'',language:'tr',masterVolume:.7,musicVolume:.4,effects:true,vibration:true,reducedMotion:false,musicTrack:0,day:'',dailyLines:0,classic:null};}
let p;try{p=JSON.parse(localStorage.getItem(KEY));if(!p||!Array.isArray(p.rewards)||!Array.isArray(p.owned))p=initial();}catch{p=initial();}
let g=null,page='home',selected=null,hover=null,drag=null,origin=0,pauseAt=0,pausedTime=0,pauseOverlay=false;
const app=document.getElementById('app'),t=(tr,en)=>p.language==='en'?en:tr;
const prices={dark:0,neon:500,forest:750,gem:1000,plain:0,bamboo:300,mountain:300,waterfall:300,custom:1500};
const rewards={first:50,thousand:100,speed:150,demolition:200,personal:250,master:1000};
const palettes={dark:['#5bb4ff','#ffbd59','#aa89ff','#59d3b8','#f581a1','#ec8964'],neon:['#10e0ee','#ff47c1','#ae5aff','#dcfa57','#ff9849','#598dff'],forest:['#66bd76','#dfbe62','#53bfbd','#a78bd4','#ec9461','#81aadd'],gem:['#8cd7ff','#cf87ee','#eec873','#6cdbbd','#f085a3','#8c9eef']};
function toast(s){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800);}
function award(x,key,amount){if(x.rewards.includes(key))return false;x.rewards.push(key);x.coins+=amount;return true;}
function achieve(x,id){if(!x.achievements.includes(id)){x.achievements.push(id);award(x,'achievement:'+id,rewards[id]);}}
function daily(x){const d=new Date(),date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(date>x.day){x.day=date;x.dailyLines=0;award(x,'login:'+date,50);}}
function save(x){try{localStorage.setItem(KEY,JSON.stringify(x));p=x;return true;}catch{toast(t('Kayıt başarısız. Hamle uygulanmadı.','Save failed. Move was not applied.'));return false;}}
function applyRewards(x,gg,res){daily(x);x.coins+=res.coins;x.dailyLines+=res.lines||0;if(x.dailyLines>=20)award(x,'quest:'+x.day,100);if(res.bomb)x.bombUses++;if(x.bombUses>=10)achieve(x,'demolition');if(gg.mode==='classic'){x.classicBest=Math.max(x.classicBest,gg.score);if(gg.score>=1000)achieve(x,'thousand');x.classic=gg.outcome==='playing'?copy(gg):null;}if(gg.mode==='timeAttack'){x.timeBest=Math.max(x.timeBest,gg.score);if(gg.lines>=10)achieve(x,'speed');}if(gg.mode==='rush'&&gg.outcome==='won')x.rushBest=Math.min(x.rushBest??gg.placements,gg.placements);if(gg.level&&gg.outcome==='won'){const n=stars(gg,LEVELS);x.levelStars[gg.level]=Math.max(x.levelStars[gg.level]||0,n);x.levelScores[gg.level]=Math.max(x.levelScores[gg.level]||0,gg.score);award(x,'level:'+gg.level,100);if(n===3)award(x,'three:'+gg.level,50);if(gg.level===1)achieve(x,'first');if(Array.from({length:20},(_,i)=>x.levelStars[i+1]===3).every(Boolean))achieve(x,'master');}}
const temp=copy(p);daily(temp);save(temp);
let music=new Audio(),fx=new Audio(),playingTrack=-2,userAudio=false;
function audioStart(){userAudio=true;configureAudio();}
function configureAudio(){music.volume=p.masterVolume*p.musicVolume;fx.volume=p.masterVolume;if(!userAudio||document.hidden)return;if(playingTrack!==p.musicTrack){playingTrack=p.musicTrack;music.src=ASSETS['music'+(p.musicTrack<0?Math.floor(Math.random()*3):p.musicTrack)];music.loop=p.musicTrack>=0;}music.play().catch(()=>{});}
music.onended=()=>{if(p.musicTrack<0){playingTrack=-2;configureAudio();}};
function sound(id){if(!p.effects||document.hidden)return;fx.src=ASSETS[id];fx.volume=p.masterVolume;fx.play().catch(()=>{});}
function unlocked(){return Math.min(20,Math.max(0,...Object.keys(p.levelStars).map(Number))+1);}
function start(mode,level=null,resume=false){if(mode==='adventure'&&(!level||level<1||level>unlocked())){toast(t('Bu bölüm kilitli','Level locked'));return false;}g=resume?copy(p.classic):newGame(mode,level?LEVELS[level-1]:null);if(!g||g.board.length!==64||g.tray.length!==3){g=newGame('classic');}g.paused=false;origin=performance.now()-g.elapsed;pausedTime=0;selected=null;hover=null;pauseOverlay=false;page='game';audioStart();render();return true;}
function attempt(slot,r,c,bomb=false){if(!g||g.paused||pauseOverlay)return;updateTime();if(g.outcome!=='playing'){render();return;}const gg=copy(g),res=move(gg,slot,r,c,LEVELS,bomb);if(!res){toast(t('Buraya yerleştirilemez','Cannot place here'));return;}res.lines=gg.lines-g.lines;const next=copy(p);applyRewards(next,gg,res);if(save(next)){animateCells(res.cleared);g=gg;sound(bomb?'bomb':res.lines?'clear':'place');if(p.vibration&&res.cleared.length)navigator.vibrate?.(20);}selected=null;hover=null;render();}
function animateCells(indices){if(p.reducedMotion)return;const cells=document.querySelectorAll('.cell');for(const i of indices){const b=cells[i]?.getBoundingClientRect();if(!b)continue;for(let k=0;k<4;k++){const e=document.createElement('i');e.className='particle';e.style.cssText=`left:${b.x+b.width/2}px;top:${b.y+b.height/2}px;--dx:${Math.cos(k*Math.PI/2+i)*36}px;--dy:${Math.sin(k*Math.PI/2+i)*36}px`;document.getElementById('particles').append(e);setTimeout(()=>e.remove(),450);}}}
function updateTime(){if(!g||g.outcome!=='playing'||(g.paused&&g.mode!=='timeAttack'))return;g.elapsed=Math.max(g.elapsed,performance.now()-origin-pausedTime);if(g.mode==='timeAttack'&&g.elapsed>=g.budget)g.outcome='lost';}
function pause(){if(!g||g.outcome!=='playing')return;updateTime();if(g.mode!=='timeAttack')pauseAt=performance.now();g.paused=true;pauseOverlay=true;render();}
function resume(){if(g.mode!=='timeAttack')pausedTime+=performance.now()-pauseAt;g.paused=false;pauseOverlay=false;render();}
function home(){if(g?.mode==='classic'&&g.outcome==='playing'){let x=copy(p);x.classic=copy(g);x.classic.paused=false;if(!save(x))return;}g=null;page='home';pauseOverlay=false;render();}
function nav(to){page=to;audioStart();render();}
function piece(id,s=18){if(!id)return '<span style="color:#455979">✓</span>';const cells=shapes[id],w=Math.max(...cells.map(x=>x[1]))+1,h=Math.max(...cells.map(x=>x[0]))+1,color=palettes[p.theme][Object.keys(shapes).indexOf(id)%6];return `<span class="piece" style="--w:${w};--h:${h};--s:${s}px;--block:${color}">${Array.from({length:w*h},(_,i)=>cells.some(([r,c])=>r===Math.floor(i/w)&&c===i%w)?'<b></b>':'<i></i>').join('')}</span>`;}
function header(name){return `<div class="row"><button onclick="nav('home')" aria-label="${t('Ana menü','Home')}">‹</button><strong>${name}</strong><span class="badge">◉ ${p.coins}</span></div>`;}
function render(){
 document.documentElement.lang=p.language;document.getElementById('bg').style.backgroundImage=p.background==='custom'?`url('${p.photo}')`:ASSETS[p.background]?`url('${ASSETS[p.background]}')`:'none';
 document.body.style.setProperty('--tile',{dark:'#172541',neon:'#191334',forest:'#122d26',gem:'#27213c'}[p.theme]);document.body.style.setProperty('--edge',palettes[p.theme][2]+'77');document.body.style.setProperty('--spark',palettes[p.theme][0]);
 if(page==='home'){app.innerHTML=`<div class="row"><span class="eyebrow">OFFLINE PUZZLE</span><span class="pill">${t('Tarayıcı provası','Browser rehearsal')}</span></div><div class="hero"><div class="logo">${'<i></i>'.repeat(9)}</div><h1>BLOCK<br>CRASH</h1><p>${t('Bir hamle. Yeni bir ihtimal.','One move. A new possibility.')}</p></div><div class="stats"><div class="stat"><strong class="gold">${p.classicBest}</strong><span class="eyebrow">${t('CLASSIC REKOR','CLASSIC BEST')}</span></div><div class="stat"><strong>${p.coins}</strong><span class="eyebrow">${t('JETON','COINS')}</span></div></div><div class="stack"><button class="primary" onclick="nav('modes')">▶ ${t('OYNA','PLAY')} <span>→</span></button>${p.classic?`<button onclick="start('classic',null,true)">↻ ${t('Classic oyununa devam','Continue Classic')} →</button>`:''}<button onclick="nav('adventure')">◇ ${t('Macera','Adventure')} <span>→</span></button><button onclick="nav('shop')">◈ ${t('Mağaza','Shop')} <span>→</span></button><button onclick="nav('achievements')">☆ ${t('Başarılar','Achievements')} <span>→</span></button><button onclick="nav('settings')">⚙ ${t('Ayarlar','Settings')} <span>→</span></button></div><div class="card" style="margin-top:20px"><span class="eyebrow">${t('GÜNLÜK GÖREV','DAILY QUEST')}</span><p style="margin-bottom:6px">${t('20 çizgi temizle · 100 jeton','Clear 20 lines · 100 coins')}</p><div class="progress"><span style="width:${Math.min(100,p.dailyLines*5)}%"></span></div><small>${Math.min(20,p.dailyLines)}/20 · ${t('Günlük giriş: 50 jeton','Daily login: 50 coins')}</small></div><p class="note" style="text-align:center">${t('Flutter sürümü ayrı kaynak projededir. Bu prova yerel tarayıcı kaydı kullanır.','The Flutter version is in the source project. This rehearsal uses browser storage.')}</p>`;return;}
 if(page==='modes'){const modes=[['classic','Classic',t('Sınır yok. Rekorunu geliştir.','No limits. Beat your best.')],['timeAttack','Time Attack',t('60 saniye. Çoklu çizgilerle süre kazan.','60 seconds. Multiple lines earn extra time.')],['rush','High Score Rush',t('5.000 puan. Daha az hamle.','5,000 points. Fewer moves.')],['adventure',t('Macera','Adventure'),t('20 sabit bölüm ve bomba görevleri.','20 fixed levels and bomb challenges.')]];app.innerHTML=header(t('Oyun modu','Game mode'))+`<h2>${t('Nasıl oynamak istersin?','How will you play?')}</h2>`+modes.map(([id,name,desc])=>`<button class="card" style="width:100%;text-align:left;margin-top:14px" onclick="${id==='adventure'?"nav('adventure')":`start('${id}')`}"><h3>${name} →</h3><span class="note">${desc}</span></button>`).join('');return;}
 if(page==='adventure'){app.innerHTML=header(t('Macera haritası','Adventure map'))+`<h2>${t('Yıldızlara doğru','Reach for the stars')}</h2><p>${t('Her bölümde yeni bir hedef.','A new goal in every level.')}</p><div class="map">${LEVELS.map(l=>`<button ${l.id>unlocked()?'disabled':''} onclick="start('adventure',${l.id})">${l.id>unlocked()?'▣':l.id}<small>${'★'.repeat(p.levelStars[l.id]||0)+'☆'.repeat(3-(p.levelStars[l.id]||0))}</small></button>`).join('')}</div><p class="note">${t('1–5 Temel çizgiler · 6–10 Puan hedefleri · 11–15 Yerleştirme sınırları · 16–20 Bomba görevleri','1–5 Basic lines · 6–10 Score goals · 11–15 Placement limits · 16–20 Bomb challenges')}</p>`;return;}
 if(page==='game'){const l=g.level?LEVELS[g.level-1]:null;const target=g.mode==='timeAttack'?`<span id="countdown">${Math.ceil(Math.max(0,g.budget-g.elapsed)/1000)}</span> ${t('saniye','seconds')}`:g.mode==='rush'?`${g.score}/5.000`:l?l.targetScore?`${g.score}/${l.targetScore} ${t('puan','points')}`:`${g.lines}/${l.targetLines} ${t('çizgi','lines')}`:`${t('Rekor','Best')}: ${p.classicBest}`;app.innerHTML=`<div class="row"><button onclick="home()" aria-label="${t('Menü','Menu')}">‹</button><strong>${l?t('Bölüm ','Level ')+l.id:{classic:'Classic',timeAttack:'Time Attack',rush:'High Score Rush'}[g.mode]}</strong><button onclick="pause()" aria-label="${t('Duraklat','Pause')}">Ⅱ</button></div><div class="row hud" style="margin-top:16px"><div><span class="eyebrow">${t('PUAN','SCORE')}</span><br><strong>${g.score}</strong></div><div style="text-align:right"><b>${target}</b><br><small class="note">${g.moves} ${t('hamle','moves')} · ${g.placements} ${t('yerleştirme','placements')}</small>${l?.maxMoves?`<br><small class="badge">${t('Hamle sınırı','Move limit')}: ${l.maxMoves}</small>`:l?.maxPlacements?`<br><small class="badge">${t('Yerleştirme sınırı','Placement limit')}: ${l.maxPlacements}</small>`:''}</div></div><div class="scorefx">Combo ×${g.last.combo} · Streak ×${mult(g.streak)} · +${g.last.points}</div><div class="board" id="board" role="group" aria-label="8 × 8 ${t('tahta','board')}">${g.board.map((color,i)=>`<button class="cell ${color?'filled':''}" ${color?`style="--block:${palettes[p.theme][color-1]}"`:''} data-cell="${i}" onclick="boardTap(${i})" aria-label="${t('Satır','Row')} ${Math.floor(i/8)+1}, ${t('sütun','column')} ${i%8+1}, ${color?t('dolu','occupied'):t('boş','empty')}"></button>`).join('')}</div><div class="tray">${g.tray.map((id,s)=>`<button class="slot ${selected===s?'selected':''}" data-slot="${s}" ${!id?'disabled':''} aria-label="${t('Parça','Piece')} ${s+1}: ${id||t('kullanıldı','used')}">${piece(id)}</button>`).join('')}</div>${l?.bombs?`<div style="text-align:center;margin-top:12px"><button data-slot="-1" ${!g.bombs?'disabled':''}>✹ ${t('Bomba','Bomb')} ×${g.bombs}</button></div>`:''}<p class="note" style="text-align:center;margin-top:12px">${t('Sürükle veya parça seçip tahtaya dokun.','Drag, or select a piece and tap the board.')}</p>`;if(g.outcome!=='playing')result();else if(pauseOverlay)pauseDialog();return;}
 if(page==='shop'){const names={dark:'Classic Dark',neon:'Neon Glow',forest:'Forest',gem:'Gem & Crystal',plain:t('Sade','Plain'),bamboo:t('Bambu ormanı','Bamboo forest'),mountain:t('Dağ','Mountain'),waterfall:t('Şelale','Waterfall'),custom:t('Kendi fotoğrafın','Your photo')};app.innerHTML=header(t('Mağaza','Shop'))+`<h2>${t('Kendi oyun alanın','Make it yours')}</h2><p>◉ ${p.coins} ${t('jeton','coins')}</p>`+Object.keys(prices).map((id,i)=>`${i===0||i===4?`<h3 style="margin-top:26px">${i===0?t('Temalar','Themes'):t('Arka planlar','Backgrounds')}</h3>`:''}<div class="shopline card"><div><b>${names[id]}</b><small>${p.owned.includes(id)?t('Açıldı','Unlocked'):prices[id]+' '+t('jeton','coins')}</small></div><button ${!p.owned.includes(id)&&p.coins<prices[id]?'disabled':''} onclick="buy('${id}')">${id==='custom'&&p.owned.includes(id)?t('Fotoğraf seç','Pick photo'):p.theme===id||p.background===id?t('Seçili','Selected'):p.owned.includes(id)?t('Seç','Select'):t('Aç','Unlock')}</button></div>`).join('')+'<input type="file" id="photo" accept="image/*" hidden onchange="photoChosen(this)">';return;}
 if(page==='achievements'){const desc=[t('Adventure 1’i tamamla','Complete Adventure 1'),t('Classic’te 1.000 puan','Score 1,000 in Classic'),t('Tek Time Attack turunda 10 çizgi','10 lines in one Time Attack'),t('Toplam 10 bomba kullan','Use 10 bombs'),t('Özel arka planı aç ve kullan','Unlock and use a custom photo'),t('20 bölümde 3 yıldız','3 stars in all 20 levels')],names=[t('İlk Adım','First Step'),t('Binlik Skor','Thousand Points'),t('Hız Ustası','Speed Master'),t('Yıkım Uzmanı','Demolition Expert'),t('Kişisel Dokunuş','Personal Touch'),t('Büyük Usta','Grand Master')];app.innerHTML=header(t('Başarılar','Achievements'))+'<h2>'+t('Her başarı bir adım','Every achievement counts')+'</h2>'+Object.keys(rewards).map((id,i)=>`<div class="card" style="margin-top:14px"><h3 class="${p.achievements.includes(id)?'gold':''}">${p.achievements.includes(id)?'★':'☆'} ${names[i]}</h3><p class="note">${desc[i]} · ${rewards[id]} ${t('jeton','coins')} ${p.achievements.includes(id)?'✓':''}</p></div>`).join('');return;}
 if(page==='settings'){app.innerHTML=header(t('Ayarlar','Settings'))+`<h2>${t('Sana göre','Your preferences')}</h2>`+['masterVolume','musicVolume'].map((k,i)=>`<div class="setting"><label>${[t('Ana ses seviyesi','Master volume'),t('Müzik seviyesi','Music volume')][i]} <span>${Math.round(p[k]*100)}%</span></label><input aria-label="${k}" type="range" min="0" max="1" step=".01" value="${p[k]}" onchange="setting('${k}',+this.value)"></div>`).join('')+['effects','vibration','reducedMotion'].map((k,i)=>`<div class="setting"><label>${[t('Ses efektleri','Sound effects'),t('Titreşim','Haptics'),t('Azaltılmış hareket','Reduced motion')][i]}<input type="checkbox" ${p[k]?'checked':''} onchange="setting('${k}',this.checked)"></label></div>`).join('')+`<div class="setting">${t('Müzik','Music')}<select onchange="setting('musicTrack',+this.value)">${[-1,0,1,2].map(n=>`<option value="${n}" ${n===p.musicTrack?'selected':''}>${n===-1?t('Karışık','Shuffle'):['Bamboo Dawn','Quiet Mountain','Crystal Stream'][n]}</option>`).join('')}</select></div><div class="setting">${t('Dil','Language')}<select onchange="setting('language',this.value)"><option value="tr" ${p.language==='tr'?'selected':''}>Türkçe</option><option value="en" ${p.language==='en'?'selected':''}>English</option></select></div><p class="note">${t('Kayıtlar bu tarayıcıdadır. Özel fotoğraf, tarayıcı depolama sınırına tabidir.','Saves stay in this browser. Custom photos are subject to browser storage limits.')}</p>`;}
}
function boardTap(i){if(selected===null)return;attempt(selected,Math.floor(i/8),i%8,selected===-1);}
function buy(id){let x=copy(p);if(!x.owned.includes(id)){if(x.coins<prices[id])return;x.coins-=prices[id];x.owned.push(id);}if(['dark','neon','forest','gem'].includes(id))x.theme=id;else if(id!=='custom')x.background=id;if(save(x)){render();if(id==='custom')document.getElementById('photo').click();}}
function photoChosen(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1400/image.width,1800/image.height);canvas.width=image.width*scale;canvas.height=image.height*scale;canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const x=copy(p);x.photo=canvas.toDataURL('image/jpeg',.8);x.background='custom';achieve(x,'personal');if(save(x))render();};image.onerror=()=>toast(t('Fotoğraf açılamadı','Cannot read photo'));image.src=reader.result;};reader.readAsDataURL(file);}
function setting(key,value){const x=copy(p);x[key]=value;if(save(x)){configureAudio();render();}}
function result(){const won=g.outcome==='won',n=stars(g,LEVELS);app.innerHTML+=`<div class="result"><div class="inner"><span class="eyebrow">BLOCK CRASH</span><h2>${won?t('Harika iş!','Great work!'):g.mode==='timeAttack'&&g.elapsed>=g.budget?t('Süre doldu','Time is up'):g.mode==='classic'||g.mode==='timeAttack'?t('Oyun bitti','Game over'):t('Hedef tamamlanamadı','Goal not reached')}</h2>${won?`<div class="stars">${'★'.repeat(n)+'☆'.repeat(3-n)}</div>`:''}<strong>${g.score}</strong><p>${g.lines} ${t('çizgi','lines')} · ${g.moves} ${t('hamle','moves')}</p><div class="stack">${won&&g.level&&g.level<20?`<button class="primary" onclick="start('adventure',${g.level+1})">${t('Sonraki bölüm','Next level')} →</button>`:''}<button onclick="start('${g.mode}',${g.level})">${t('Yeniden oyna','Play again')} ↻</button><button onclick="home()">${t('Ana menü','Main menu')} →</button></div></div></div>`;}
function pauseDialog(){app.innerHTML+=`<div class="result"><div class="inner"><h2>${t('Duraklatıldı','Paused')}</h2><p>${g.mode==='timeAttack'?t('Time Attack geri sayımı devam ediyor.','Time Attack countdown continues.'):t('Hazır olduğunda devam et.','Continue when ready.')}</p><div class="stack"><button class="primary" onclick="resume()">${t('Devam','Continue')} →</button><button onclick="start('${g.mode}',${g.level})">${t('Yeniden başlat','Restart')} ↻</button><button onclick="home()">${t('Ana menü','Main menu')}</button></div></div></div>`;}
app.addEventListener('keydown',e=>{const btn=e.target.closest('[data-slot]');if(btn&&!btn.disabled&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selected=+btn.dataset.slot;render();}});
let activePointer=null;
app.addEventListener('pointerdown',e=>{const btn=e.target.closest('[data-slot]');if(!btn||btn.disabled||g?.outcome!=='playing'||g.paused)return;audioStart();selected=+btn.dataset.slot;activePointer=e.pointerId;btn.setPointerCapture(e.pointerId);drag={slot:selected,x:e.clientX,y:e.clientY,started:false,button:btn};document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('selected',+s.dataset.slot===selected));});
app.addEventListener('pointermove',e=>{if(!drag||activePointer!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.started=true;if(!drag.started)return;const board=document.getElementById('board');if(!board)return;const rect=board.getBoundingClientRect(),step=(rect.width-10)/8;let id=drag.slot>=0?g.tray[drag.slot]:null,w=id?Math.max(...shapes[id].map(c=>c[1]))+1:1,h=id?Math.max(...shapes[id].map(c=>c[0]))+1:1;let x=e.clientX-(id?w*step/2:0),y=e.clientY-(id?h*step+42:54);hover={r:Math.floor((y-rect.y-5)/step),c:Math.floor((x-rect.x-5)/step)};document.querySelector('.ghost')?.remove();const ghost=document.createElement('div');ghost.className='ghost';ghost.style.cssText=`left:${x}px;top:${y}px`;ghost.innerHTML=id?piece(id,step-2):'<span style="font-size:34px;color:#ffc67a">✹</span>';document.body.append(ghost);document.querySelectorAll('.cell').forEach(c=>c.classList.remove('valid','invalid'));const valid=drag.slot===-1?hover.r>=0&&hover.r<8&&hover.c>=0&&hover.c<8:fits(g,id,hover.r,hover.c);const cells=drag.slot===-1?Array.from({length:9},(_,i)=>[Math.floor(i/3)-1,i%3-1]):shapes[id];for(const [dr,dc] of cells){const r=hover.r+dr,c=hover.c+dc;if(r>=0&&r<8&&c>=0&&c<8)document.querySelectorAll('.cell')[r*8+c].classList.add(valid?'valid':'invalid');}});
app.addEventListener('pointerup',e=>{if(!drag||activePointer!==e.pointerId)return;const d=drag,h=hover;drag=null;activePointer=null;document.querySelector('.ghost')?.remove();if(d.started&&h)attempt(d.slot,h.r,h.c,d.slot===-1);else{hover=null;render();}});
app.addEventListener('pointercancel',()=>{drag=null;activePointer=null;hover=null;document.querySelector('.ghost')?.remove();render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();fx.pause();if(g&&g.mode!=='timeAttack'&&g.outcome==='playing'&&!g.paused)pause();}else{configureAudio();const x=copy(p);daily(x);save(x);updateTime();render();}});
setInterval(()=>{if(page!=='game'||!g)return;const old=g.outcome;updateTime();const count=document.getElementById('countdown');if(count)count.textContent=Math.ceil(Math.max(0,g.budget-g.elapsed)/1000);if(old!==g.outcome)render();},100);
render();
</script></body></html>
